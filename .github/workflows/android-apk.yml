name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html styles.css app.js manifest.json *.svg *.png android/app/src/main/assets/www/

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk sunwise.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sunwise-apk
          path: sunwise.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sunwise build ${{ github.run_number }}
          body: Install sunwise.apk on your Android phone (allow installs from unknown sources).
          files: sunwise.apk
          make_latest: true
